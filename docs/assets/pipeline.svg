<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" role="img" aria-labelledby="title desc"><title id="title">Research pipeline</title><desc id="desc">Data preparation, controlled training, matched evaluation, and evidence audit.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#6d8799"/></marker></defs><rect width="1400" height="330" rx="18" fill="#f5f8fc"/>
 <text x="40" y="48" fill="#102238" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="22">EXPERIMENT PIPELINE</text><rect x="36" y="83" width="307" height="168" rx="14" fill="white" stroke="#d9e3ee"/><rect x="54" y="101" width="38" height="30" rx="8" fill="#e2f6f0"/><text x="61" y="122" fill="#087f74" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">01</text><text x="54" y="161" fill="#17324c" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="bold">PIN &amp; VERIFY</text><text x="54" y="193" fill="#38546d" font-family="DejaVu Sans,sans-serif" font-size="14">Official ToolRL + veRL</text><text x="54" y="222" fill="#6b7d8f" font-family="DejaVu Sans,sans-serif" font-size="12">Data / reward compatibility checks</text><path d="M348 168H368" stroke="#6d8799" stroke-width="2" marker-end="url(#arrow)"/><rect x="376" y="83" width="307" height="168" rx="14" fill="white" stroke="#d9e3ee"/><rect x="394" y="101" width="38" height="30" rx="8" fill="#e2f6f0"/><text x="401" y="122" fill="#087f74" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">02</text><text x="394" y="161" fill="#17324c" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="bold">TRAIN GRPO</text><text x="394" y="193" fill="#38546d" font-family="DejaVu Sans,sans-serif" font-size="14">Qwen2.5-3B-Instruct</text><text x="394" y="222" fill="#6b7d8f" font-family="DejaVu Sans,sans-serif" font-size="12">15 epochs · final checkpoint only</text><path d="M688 168H708" stroke="#6d8799" stroke-width="2" marker-end="url(#arrow)"/><rect x="716" y="83" width="307" height="168" rx="14" fill="white" stroke="#d9e3ee"/><rect x="734" y="101" width="38" height="30" rx="8" fill="#e2f6f0"/><text x="741" y="122" fill="#087f74" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">03</text><text x="734" y="161" fill="#17324c" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="bold">EVALUATE TWO SUITES</text><text x="734" y="193" fill="#38546d" font-family="DejaVu Sans,sans-serif" font-size="14">API-Bank / BFCL V3</text><text x="734" y="222" fill="#6b7d8f" font-family="DejaVu Sans,sans-serif" font-size="12">Same per-benchmark protocol</text><path d="M1028 168H1048" stroke="#6d8799" stroke-width="2" marker-end="url(#arrow)"/><rect x="1056" y="83" width="307" height="168" rx="14" fill="white" stroke="#d9e3ee"/><rect x="1074" y="101" width="38" height="30" rx="8" fill="#e2f6f0"/><text x="1081" y="122" fill="#087f74" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">04</text><text x="1074" y="161" fill="#17324c" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="bold">AUDIT EVERY TASK</text><text x="1074" y="193" fill="#38546d" font-family="DejaVu Sans,sans-serif" font-size="14">Soft vs strict / official checker</text><text x="1074" y="222" fill="#6b7d8f" font-family="DejaVu Sans,sans-serif" font-size="12">Keep context failures in denominator</text><text x="40" y="294" fill="#6b7d8f" font-family="DejaVu Sans,sans-serif" font-size="14">Frozen protocols · matched controls · full denominators · retained failures · final-only checkpoints</text></svg>